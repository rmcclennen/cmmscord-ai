<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline | AssetCareConnect</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        font-size: 1.4rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        color: #cbd5e1;
        margin: 0.5rem 0;
      }
      button {
        margin-top: 1rem;
        min-height: 44px;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 10px;
        font: inherit;
        font-weight: 600;
        background: #0284c7;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        This page hasn't been saved on your device yet. Pages you have already opened still work,
        and any changes you make are saved and sent when you're back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
